# ============================================================
#  行情下载配置
#  在下面各市场的 tickers 列表里增删你要跟踪的股票代码即可。
#  代码格式（Yahoo Finance 规则）：
#    美股 US  : 直接用代码            例: AAPL, MSFT, NVDA
#    港股 HK  : 4-5位数字 + .HK       例: 0700.HK (腾讯), 9988.HK (阿里)
#    新加坡 SG: 交易代码 + .SI        例: D05.SI (星展), O39.SI (华侨)
#    股指 INDEX: 用 ^ 开头            例: ^GSPC (标普500), ^HSI (恒生)
#  每个市场（含 INDEX）会各自存成一个 CSV：<日期>/US.csv、<日期>/INDEX.csv ...
# ============================================================

# 每次运行时，向前回看多少个自然日来抓取最新的日线（用来补齐、去重）
lookback_days: 7

# 数据输出根目录（绝对路径）。程序会在其下按交易日期建 yyyymmdd 子文件夹，
# 每个日期文件夹内每个市场一个 CSV：US.csv / HK.csv / SG.csv / INDEX.csv
output_dir: /Users/bruce/Documents/Stock

# 每个请求之间的间隔秒数（避免请求过快被限流）
request_delay: 0.8

# 某只无数据时的自动重试（应对数据源瞬时抽风）
retries: 2           # 重试次数
retry_delay: 3       # 每次重试前等待秒数

# 标的类型标记：下列代码视为 ETF，其余(非指数)视为个股。
# 仅供扫描器区分「个股 / ETF」用，不影响下载。
etf_tickers:
  - SPY
  - QQQ
  - DIA
  - 2800.HK
  - 2828.HK
  - ES3.SI

# 排除名单：这些代码即使历史数据里有，也不参与扫描/回测/分析。
exclude_tickers:
  - 601127.SS   # 赛力斯(已排除)
  - 2097.HK     # 蜜雪冰城(已排除)
  - 2007.HK     # 碧桂园(已排除)
